<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="#{todo.list.title}">Todo List</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-1" th:text="#{todo.list.heading}">Todo List</h1>
            <p class="mb-0 text-muted">
                <span th:text="#{todo.owner.label}">List of:</span>
                <strong th:text="${ownerName}">Owner</strong>
            </p>
        </div>
        <div>
            <a class="btn btn-outline-secondary btn-sm mr-2" th:href="@{/todos(lang='vi')}" th:text="#{language.vi}">Tiếng Việt</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/todos(lang='en')}" th:text="#{language.en}">English</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="mb-3">
        <a class="btn btn-primary" th:href="@{/add}" th:text="#{todo.add}">Add Todo</a>
    </div>

    <table class="table table-striped">
        <thead class="thead-dark">
        <tr>
            <th th:text="#{todo.id}">ID</th>
            <th th:text="#{todo.content}">Content</th>
            <th th:text="#{todo.dueDate}">Due Date</th>
            <th th:text="#{todo.status}">Status</th>
            <th th:text="#{todo.priority}">Priority</th>
            <th th:text="#{todo.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(todos)}">
            <td colspan="6" class="text-center text-muted" th:text="#{todo.empty}">No todos yet.</td>
        </tr>
        <tr th:each="t : ${todos}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.content}"></td>
            <td th:text="${t.dueDate}"></td>
            <td th:text="${t.status} ? #{todo.status.completed} : #{todo.status.pending}"></td>
            <td th:text="${t.priority == T(com.example.personal_todo_app.model.Priority).HIGH} ? #{todo.priority.high} : (${t.priority == T(com.example.personal_todo_app.model.Priority).MEDIUM} ? #{todo.priority.medium} : #{todo.priority.low})"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${t.id})}" class="btn btn-warning btn-sm" th:text="#{todo.edit}">Edit</a>
                <a th:href="@{/delete/{id}(id=${t.id})}" class="btn btn-danger btn-sm"
                   th:attr="onclick=|return confirm('${#messages.msg('todo.delete.confirm')}')|"
                   th:text="#{todo.delete}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
