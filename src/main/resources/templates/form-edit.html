<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="#{todo.form.editTitle}">Edit Todo</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="#{todo.form.editHeading}">Edit Todo</h1>
        <div>
            <a class="btn btn-outline-secondary btn-sm mr-2" th:href="@{/edit/{id}(id=${todo.id},lang='vi')}" th:text="#{language.vi}">Tiếng Việt</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/edit/{id}(id=${todo.id},lang='en')}" th:text="#{language.en}">English</a>
        </div>
    </div>

    <form th:action="@{/save}" method="post" th:object="${todo}">
        <div class="form-group">
            <input type="hidden" th:field="*{id}">
        </div>

        <div class="form-group">
            <label for="content" th:text="#{todo.content}">Content</label>
            <input id="content" type="text" class="form-control" th:field="*{content}"
                   th:placeholder="#{todo.content.placeholder}">
            <p class="text-danger mt-1" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
        </div>

        <div class="form-group">
            <label for="dueDate" th:text="#{todo.dueDate}">Due Date</label>
            <input id="dueDate" type="date" class="form-control" th:field="*{dueDate}">
            <p class="text-danger mt-1" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></p>
        </div>

        <div class="form-group">
            <label for="status" th:text="#{todo.status}">Status</label>
            <select id="status" class="form-control" th:field="*{status}">
                <option th:value="false" th:text="#{todo.status.pending}">Pending</option>
                <option th:value="true" th:text="#{todo.status.completed}">Completed</option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority" th:text="#{todo.priority}">Priority</label>
            <select id="priority" class="form-control" th:field="*{priority}">
                <option th:value="${T(com.example.personal_todo_app.model.Priority).HIGH}" th:text="#{todo.priority.high}">High</option>
                <option th:value="${T(com.example.personal_todo_app.model.Priority).MEDIUM}" th:text="#{todo.priority.medium}">Medium</option>
                <option th:value="${T(com.example.personal_todo_app.model.Priority).LOW}" th:text="#{todo.priority.low}">Low</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{todo.save}">Save</button>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
